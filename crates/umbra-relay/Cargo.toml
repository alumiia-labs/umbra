[package]
name = "umbra-relay"
description = "The relay of the UMBRA protocol: circuits, queues, caches, and the server binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# The server binary over the native transport stack of Part 14 §14.2.8.
# The node itself takes no socket and builds without it.
native = ["umbra-core/precis", "umbra-transport/native", "dep:tokio", "dep:tokio-rustls", "dep:rustls", "dep:getrandom", "dep:rusqlite", "dep:aws-lc-rs"]

[dependencies]
umbra-crypto = { version = "0.29.1", path = "../umbra-crypto", features = ["keygen"] }
umbra-wire = { version = "0.29.1", path = "../umbra-wire" }
umbra-onion = { version = "0.29.1", path = "../umbra-onion" }
umbra-queue = { version = "0.29.1", path = "../umbra-queue" }
umbra-transport = { version = "0.29.1", path = "../umbra-transport" }
umbra-core = { version = "0.29.1", path = "../umbra-core", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"], optional = true }
rusqlite = { version = "0.40", default-features = false, features = ["bundled"], optional = true }
# The RS256 signature of the FCM sender of the NDR. The TLS stack holds
# this crate already.
aws-lc-rs = { version = "1.18", default-features = false, features = ["aws-lc-sys"], optional = true }
getrandom = { version = "0.4", optional = true }

[[bin]]
name = "umbra-relay"
path = "src/main.rs"
required-features = ["native"]

# The Notification Delivery Relay of Part 8 §8.2.
[[bin]]
name = "umbra-ndr"
path = "src/bin/ndr.rs"
required-features = ["native"]

# The directory of Part 9 and the issuer of Part 13 §13.9.
[[bin]]
name = "umbra-directory"
path = "src/bin/directory.rs"
required-features = ["native"]

# The signer of a directory of one operator: seven keys, one machine.
[[bin]]
name = "umbra-signer"
path = "src/bin/signer.rs"
required-features = ["native"]

# The measurer of Part 10 §10.3: the class test of each relay.
[[bin]]
name = "umbra-measurer"
path = "src/bin/measurer.rs"
required-features = ["native"]

# The seven directory authorities of a test network, in one process.
[[bin]]
name = "umbra-test-authority"
path = "src/bin/test_authority.rs"
required-features = ["native"]
