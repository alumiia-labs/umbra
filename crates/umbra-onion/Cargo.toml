[package]
name = "umbra-onion"
description = "Cell construction, the per-hop UIV+ layer, and the circuit build of the UMBRA protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
umbra-crypto = { version = "0.18.1", path = "../umbra-crypto" }
umbra-wire = { version = "0.18.1", path = "../umbra-wire" }
# Register R1 of Part 14 §14.2.1: AES-256 and POLYVAL serve the onion layer
# only (Part 5 §5.1 row 5).
aes = { version = "0.9", default-features = false }
ctr = { version = "0.10", default-features = false }
polyval = { version = "0.7", default-features = false }
hkdf = { version = "0.13.0", default-features = false }
sha3 = { version = "0.11", default-features = false }
subtle = { version = "2", default-features = false }
zeroize = { version = "1", default-features = false, features = ["derive"] }

[dev-dependencies]
serde_json = "1"
