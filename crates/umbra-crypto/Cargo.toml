[package]
name = "umbra-crypto"
description = "Primitives, UMBRA-KEM, handshake, and ratchet of the UMBRA protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# Register R1 of Part 14 §14.2.1. Each line names its configuration there.
ml-kem = { version = "0.3.2", default-features = false, features = ["zeroize"] }
ml-dsa = { version = "0.1.1", default-features = false, features = ["rand_core", "zeroize"] }
x25519-dalek = { version = "3.0.0", default-features = false, features = ["static_secrets", "reusable_secrets"] }
chacha20poly1305 = { version = "0.11.0", default-features = false }
sha3 = { version = "0.11", default-features = false }
hkdf = { version = "0.13.0", default-features = false }
hmac = { version = "0.13.0", default-features = false }
subtle = { version = "2", default-features = false }
zeroize = { version = "1", default-features = false, features = ["derive", "alloc"] }
# Trait crates that the R1 graph holds already; a direct edge names them.
kem = { version = "0.3.0", default-features = false }
# Register R2 AUX-4 of Part 14 §14.2.2: the memory-hard KDF of the recovery
# code and of the at-rest wrap.
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
rand_core = { version = "0.10.1", default-features = false }
# Register R2 AUX-2 and AUX-3 of Part 14 §14.2.2: the VOPRF over ristretto255
# and the ECVRF over edwards25519, both with SHA-512. The curve crate is in
# the R1 graph already under x25519-dalek.
curve25519-dalek = { version = "5.0.0", default-features = false, features = ["zeroize", "precomputed-tables"] }
sha2 = { version = "0.11", default-features = false }
# Register R2 AUX-1 of Part 14 §14.2.2: the blind RSA signature of RFC 9474,
# written here over the big-integer arithmetic alone.
crypto-bigint = { version = "0.7.5", default-features = false, features = ["zeroize", "subtle"] }
crypto-primes = { version = "0.7.2", default-features = false, optional = true }
# Register R2 AUX-8 of Part 14 §14.2.2: Equi-X with the JIT feature off. The
# crate needs std, which each v1 platform has, thus a feature carries it.
equix = { version = "0.2.5", default-features = false, optional = true }

[features]
default = ["pow"]
pow = ["dep:equix"]
# The key generation of an issuer of cross-relay tokens (Part 13 §13.3.1).
# A client verifies and blinds, and it generates no RSA key.
keygen = ["dep:crypto-primes"]

[dev-dependencies]
# The known-answer harness reads the vendored ACVP JSON. A dev-dependency
# links into no shipped binary, thus it charges no register.
serde_json = "1"
