[package]
name = "umbra-simd"
description = "The one crate of the UMBRA protocol that permits unsafe code: the wiping allocator of the Android library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# The lints of the workspace forbid unsafe code, and an inner allow cannot
# lower a forbid. Thus this crate copies the other lints and denies unsafe
# code, with an allow at each site (Part 14 §14.3).
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
undocumented_unsafe_blocks = "deny"

# No dependency: the allocator wraps the one of std.
[dependencies]
