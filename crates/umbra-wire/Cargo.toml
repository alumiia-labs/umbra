[package]
name = "umbra-wire"
description = "Fixed-layout codecs, padding, and buckets of the UMBRA protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# The one in-workspace edge of Part 14 §14.1. Every cryptographic call of a
# codec goes through it, thus this crate links no primitive of its own.
umbra-crypto = { version = "0.18.0", path = "../umbra-crypto" }

[dev-dependencies]
serde_json = "1"
