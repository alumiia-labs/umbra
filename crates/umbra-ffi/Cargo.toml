[package]
name = "umbra-ffi"
description = "The coarse-grained client surface of the UMBRA protocol for Android"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
# The Android build adds the shared library with
# `cargo rustc -p umbra-ffi --features bindings,sqlite --crate-type cdylib`.
# A cdylib in this list would make each cross build of the workspace need
# the linker of the NDK.
crate-type = ["lib"]

[features]
# The UniFFI scaffolding of Part 14 §14.6.1. It is off by default, thus the
# client core builds and tests with no binding generator in the graph.
bindings = ["dep:uniffi", "dep:getrandom", "sqlite", "runtime"]
# The binding generator, which runs on the host only.
bindgen = ["bindings", "uniffi/cli"]
# The SQLite backend of Part 14 §14.6.4 over rusqlite with the bundled
# library, which builds C code.
sqlite = ["dep:rusqlite"]
# The client runtime over tokio and the native transport stack.
runtime = ["dep:tokio", "dep:getrandom", "umbra-transport/native"]
# A test that runs three relay servers and two client runtimes on
# localhost. The relay is a dependency of that test alone.
sockets-test = ["runtime", "dep:umbra-relay", "umbra-relay/native", "umbra-core/sockets-test"]

[[bin]]
name = "uniffi-bindgen"
required-features = ["bindgen"]

# The report queue of a directory authority of a test network (Part 10
# §10.4.2), which runs as a queue client.
[[bin]]
name = "umbra-authority"
path = "src/bin/umbra_authority/main.rs"
required-features = ["runtime"]

[dependencies]
umbra-crypto = { version = "0.42.0", path = "../umbra-crypto" }
umbra-wire = { version = "0.42.0", path = "../umbra-wire" }
umbra-core = { version = "0.42.0", path = "../umbra-core" }
umbra-queue = { version = "0.42.0", path = "../umbra-queue" }
umbra-transport = { version = "0.42.0", path = "../umbra-transport" }
umbra-relay = { version = "0.42.0", path = "../umbra-relay", optional = true }
zeroize = { version = "1", default-features = false, features = ["alloc"] }
# The fold of a text for the search of Part 14 §14.6.7: it takes the accents away.
unicode-normalization = { version = "0.1", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
uniffi = { version = "=0.32.2", default-features = false, optional = true }
getrandom = { version = "0.4", optional = true }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros"], optional = true }
rusqlite = { version = "0.40", default-features = false, features = ["bundled"], optional = true }

[dev-dependencies]
# The tests of cross-relay tokens make the RSA key of an issuer.
umbra-crypto = { version = "0.42.0", path = "../umbra-crypto", features = ["keygen"] }
