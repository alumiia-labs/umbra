# The two ingress relays alone. The other relays, the NDR, and the directory
# take connections from inside the pod. On k3s, the load balancer of the
# cluster (ServiceLB) opens the two ports on each node.
apiVersion: v1
kind: Service
metadata:
  name: devnet
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/component: network
  ports:
    - name: ingress-a
      port: 7441
      targetPort: ingress-a
    - name: ingress-b
      port: 7446
      targetPort: ingress-b
