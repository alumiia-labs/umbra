# The test network of scripts/devnet.sh on Kubernetes or k3s. Its seeds are
# in the repository, thus it protects nothing. Run it on a test cluster
# alone. deploy/k8s/README.md gives the steps.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: umbra-devnet
resources:
  - namespace.yaml
  - volume.yaml
  - deployment.yaml
  - service.yaml
configMapGenerator:
  - name: devnet
    literals:
      # The address that the relays list for clients. 10.0.2.2 is this
      # machine for an emulator. A phone or another machine needs the
      # address of the node or of the load balancer.
      - UMBRA_DEVNET_HOST=10.0.2.2
labels:
  - pairs:
      app.kubernetes.io/name: umbra-devnet
      app.kubernetes.io/part-of: umbra
    includeSelectors: true
