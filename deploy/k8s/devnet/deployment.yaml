# One pod holds the whole network, as the container of compose.yaml does.
# The relays of the network dial each other on localhost, thus they cannot
# go to pods of their own.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devnet
spec:
  replicas: 1
  # One pod at a time holds the volume and the ports.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: network
  template:
    metadata:
      labels:
        app.kubernetes.io/component: network
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: devnet
          # The image of the Dockerfile: docker compose build, then import it
          # into the cluster (README.md).
          image: umbra-devnet:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: devnet
          ports:
            - name: ingress-a
              containerPort: 7441
            - name: ingress-b
              containerPort: 7446
          readinessProbe:
            tcpSocket:
              port: ingress-a
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: state
              mountPath: /umbra/target/devnet
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: devnet
        - name: tmp
          emptyDir: {}
