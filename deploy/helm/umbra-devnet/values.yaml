# The image of the Dockerfile in the root of the repository:
# docker compose build, then give it to the cluster (deploy/helm/README.md).
image:
  repository: umbra-devnet
  tag: latest
  pullPolicy: IfNotPresent

# The address that the two ingress relays list for clients. 10.0.2.2 is the
# machine of the node for an emulator. A phone or another machine needs the
# address of the node or of the load balancer.
host: 10.0.2.2

# The two ingress relays alone. The other relays, the NDR, and the directory
# take connections from inside the pod. On k3s, the load balancer of the
# cluster (ServiceLB) opens the two ports on each node.
service:
  type: LoadBalancer
  annotations: {}

# The queues of the relays and the signed manifest, thus a restart of the
# pod ends no contact. With no volume, each new pod starts an empty network.
persistence:
  enabled: true
  # Empty takes the default class of the cluster: local-path on k3s.
  storageClass: ""
  size: 1Gi

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 2Gi

nodeSelector: {}
tolerations: []
affinity: {}
