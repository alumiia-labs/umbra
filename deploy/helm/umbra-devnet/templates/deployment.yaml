# One pod holds the whole network, as the container of compose.yaml does.
# The relays of the network dial each other on localhost, thus they cannot
# go to pods of their own.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "umbra-devnet.fullname" . }}
  labels:
    {{- include "umbra-devnet.labels" . | nindent 4 }}
spec:
  replicas: 1
  # One pod at a time holds the volume and the ports.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "umbra-devnet.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "umbra-devnet.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: devnet
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: UMBRA_DEVNET_HOST
              value: {{ include "umbra-devnet.host" . | quote }}
          ports:
            - name: ingress-a
              containerPort: 7441
            - name: ingress-b
              containerPort: 7446
          readinessProbe:
            tcpSocket:
              port: ingress-a
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: state
              mountPath: /umbra/target/devnet
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: state
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "umbra-devnet.fullname" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
