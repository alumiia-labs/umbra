apiVersion: v1
kind: Service
metadata:
  name: {{ include "umbra-devnet.fullname" . }}
  labels:
    {{- include "umbra-devnet.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "umbra-devnet.selectorLabels" . | nindent 4 }}
  ports:
    - name: ingress-a
      port: 7441
      targetPort: ingress-a
    - name: ingress-b
      port: 7446
      targetPort: ingress-b
