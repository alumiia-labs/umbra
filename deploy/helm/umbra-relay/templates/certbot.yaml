{{- /* The certificate of relay.host, from Let's Encrypt: certbot answers
       the challenge on port 80 of the node, renews twice a day, and writes
       each new certificate to <root>/tls. The relay starts again with it.
       A relay with no relay.host is in pin form (Part 10 REL-143) and
       needs no certificate of a public authority. */ -}}
{{- if and .Values.certbot .Values.relay.host }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-certbot
  labels:
    {{- include "relay.labels" . | nindent 4 }}
data:
  certbot.sh: |
    {{- .Files.Get "files/certbot.sh" | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-certbot
  labels:
    {{- include "relay.labels" . | nindent 4 }}
    app.kubernetes.io/component: certbot
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: certbot
  template:
    metadata:
      labels:
        {{- include "relay.labels" . | nindent 8 }}
        app.kubernetes.io/component: certbot
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with .Values.node }}
      nodeSelector:
        kubernetes.io/hostname: {{ . | quote }}
      {{- end }}
      initContainers:
        {{- include "relay.init" . | nindent 8 }}
      containers:
        - name: certbot
          image: {{ .Values.certbotImage }}
          command: ["sh", "/umbra/certbot.sh"]
          env:
            - { name: UMBRA_FQDN, value: {{ .Values.relay.host | quote }} }
          # Certbot answers on port 80 and writes files for other users,
          # thus it runs as root with these four capabilities alone. It
          # writes its state, its log, and its work files below the mounts.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: [ALL]
              add: [NET_BIND_SERVICE, CHOWN, FOWNER, DAC_OVERRIDE]
          resources:
            requests:
              memory: 32Mi
              cpu: 10m
            limits:
              memory: 256Mi
              cpu: 500m
          volumeMounts:
            - { name: scratch, mountPath: /tmp }
            - { name: scratch, mountPath: /var/lib/letsencrypt, subPath: work }
            - { name: scratch, mountPath: /var/log/letsencrypt, subPath: log }
            - { name: root, mountPath: /etc/letsencrypt, subPath: letsencrypt }
            - { name: root, mountPath: /etc/umbra/tls, subPath: tls }
            - { name: script, mountPath: /umbra, readOnly: true }
      volumes:
        {{- include "relay.root" . | nindent 8 }}
        - name: scratch
          emptyDir:
            sizeLimit: 64Mi
        - name: script
          configMap:
            name: {{ .Release.Name }}-certbot
{{- end }}
