{{- /* The signer server: the signer with the seven authority keys, the
       HTTPS carrier of the manifest, the authority tool, and the measurer.
       Each pod runs on the node of the signer and shares its state there,
       as the services of deploy/ansible share the signer server. */ -}}
{{- $server := include "umbra.server" (list $ .Values.signer.server) | fromJson }}
{{- $node := include "umbra.node" $server }}
---
# The signer reaches no network. It reads the descriptors, the reports, and
# the class tests from files, and it writes the manifest for the carrier.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: signer
  labels:
    {{- include "umbra.labels" . | nindent 4 }}
    app.kubernetes.io/component: signer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: signer
  template:
    metadata:
      labels:
        {{- include "umbra.labels" . | nindent 8 }}
        app.kubernetes.io/component: signer
      annotations:
        checksum/descriptors: {{ toJson .Values.network.descriptors | sha256sum }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: {{ $node }}
      initContainers:
        {{- include "umbra.init" . | nindent 8 }}
      containers:
        - name: signer
          image: {{ include "umbra.serverImage" (list . $server) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["signer"]
          env:
            - { name: UMBRA_OPERATOR, value: {{ .Values.operator | quote }} }
            - { name: UMBRA_RELAYS, value: {{ include "umbra.relayList" . | quote }} }
            - { name: UMBRA_REVOKED_MEASURERS, value: {{ include "umbra.revoked" . | quote }} }
            - { name: UMBRA_SIGNER_KEYS, value: "/var/lib/umbra-signer/{{ .Values.signer.keysDir }}" }
            - { name: UMBRA_MEASURER_CERT_EPOCHS, value: {{ .Values.measurer.certEpochs | quote }} }
          resources:
            requests:
              memory: {{ .Values.memory.signer.request }}
            limits:
              memory: {{ .Values.memory.signer.limit }}
          securityContext:
            {{- include "umbra.security" (dict "uid" 10004) | nindent 12 }}
          volumeMounts:
            {{- include "umbra.baseMounts" . | nindent 12 }}
            - { name: root, mountPath: /var/lib/umbra-signer, subPath: signer }
            - { name: root, mountPath: /var/lib/umbra-authority-keys, subPath: authority-keys }
            - { name: root, mountPath: /var/www/umbra/.well-known/umbra, subPath: www }
            - { name: root, mountPath: /var/lib/umbra-authority, subPath: authority, readOnly: true }
            - { name: root, mountPath: /var/lib/umbra-measurer, subPath: measurer, readOnly: true }
            - { name: root, mountPath: /var/lib/umbra-measurer/cert, subPath: measurer/cert }
            - { name: descriptors, mountPath: /etc/umbra-signer/descriptors, readOnly: true }
      volumes:
        {{- include "umbra.volumes" . | nindent 8 }}
        - name: descriptors
          configMap:
            name: {{ .Release.Name }}-descriptors
---
# The signer pod takes no connection and opens none.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: signer
  labels:
    {{- include "umbra.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: signer
  policyTypes: [Ingress, Egress]
---
# The HTTPS carrier of the manifest (Part 3 §3.10), on port 443 of the node.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: manifest
  labels:
    {{- include "umbra.labels" . | nindent 4 }}
    app.kubernetes.io/component: manifest
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: manifest
  template:
    metadata:
      labels:
        {{- include "umbra.labels" . | nindent 8 }}
        app.kubernetes.io/component: manifest
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: {{ $node }}
      securityContext:
        supplementalGroups: [10000]
      initContainers:
        {{- include "umbra.init" . | nindent 8 }}
      containers:
        - name: manifest
          image: {{ include "umbra.serverImage" (list . $server) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["manifest"]
          env:
            - { name: UMBRA_LISTEN_PORT, value: "443" }
          ports:
            - name: https
              containerPort: 443
          readinessProbe:
            tcpSocket:
              port: 443
            periodSeconds: 10
          resources:
            requests:
              memory: 32Mi
            limits:
              memory: 256Mi
          securityContext:
            {{- include "umbra.security" (dict "uid" 10004) | nindent 12 }}
          volumeMounts:
            {{- include "umbra.baseMounts" . | nindent 12 }}
            - { name: root, mountPath: /var/www/umbra/.well-known/umbra, subPath: www, readOnly: true }
            - { name: root, mountPath: /etc/umbra/tls, subPath: tls, readOnly: true }
      volumes:
        {{- include "umbra.volumes" . | nindent 8 }}
---
# The authority tool signs as authority 0 and as the aggregators 0 and 1. It
# reaches the network, thus it sees those two seeds alone: the signer copies
# them to a directory of their own.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authority
  labels:
    {{- include "umbra.labels" . | nindent 4 }}
    app.kubernetes.io/component: authority
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: authority
  template:
    metadata:
      labels:
        {{- include "umbra.labels" . | nindent 8 }}
        app.kubernetes.io/component: authority
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: {{ $node }}
      initContainers:
        {{- include "umbra.init" . | nindent 8 }}
      containers:
        - name: authority
          image: {{ include "umbra.serverImage" (list . $server) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["authority"]
          env:
            - { name: UMBRA_SIGNER_KEYS, value: /var/lib/umbra-signer/keys }
            {{- include "umbra.trustEnv" . | nindent 12 }}
          resources:
            requests:
              memory: {{ .Values.memory.service.request }}
            limits:
              memory: {{ .Values.memory.service.limit }}
          securityContext:
            {{- include "umbra.security" (dict "uid" 10004) | nindent 12 }}
          volumeMounts:
            {{- include "umbra.baseMounts" . | nindent 12 }}
            - { name: root, mountPath: /var/lib/umbra-authority, subPath: authority }
            - { name: root, mountPath: /var/www/umbra/.well-known/umbra, subPath: www, readOnly: true }
            - { name: root, mountPath: /var/lib/umbra-signer/keys, subPath: authority-keys, readOnly: true }
            {{- include "umbra.trustMount" . | nindent 12 }}
      volumes:
        {{- include "umbra.volumes" . | nindent 8 }}
---
# The class test of each relay one time in each 7 days (Part 10 §10.3), as
# a user of its own, which reads no authority key.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: measurer
  labels:
    {{- include "umbra.labels" . | nindent 4 }}
    app.kubernetes.io/component: measurer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: measurer
  template:
    metadata:
      labels:
        {{- include "umbra.labels" . | nindent 8 }}
        app.kubernetes.io/component: measurer
      annotations:
        checksum/descriptors: {{ toJson .Values.network.descriptors | sha256sum }}
    spec:
      # A test sends at the rate of the plan, thus it takes the network of
      # the node.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: {{ $node }}
      initContainers:
        {{- include "umbra.init" . | nindent 8 }}
      containers:
        - name: measurer
          image: {{ include "umbra.serverImage" (list . $server) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["measurer"]
          env:
            - { name: UMBRA_RELAYS, value: {{ include "umbra.relayList" . | quote }} }
            - { name: UMBRA_MEASURER_CAPACITY, value: {{ .Values.measurer.capacity | quote }} }
            {{- include "umbra.trustEnv" . | nindent 12 }}
          resources:
            requests:
              memory: {{ .Values.memory.service.request }}
            limits:
              memory: {{ .Values.memory.service.limit }}
          securityContext:
            {{- include "umbra.security" (dict "uid" 10005) | nindent 12 }}
          volumeMounts:
            {{- include "umbra.baseMounts" . | nindent 12 }}
            - { name: root, mountPath: /var/lib/umbra-measurer, subPath: measurer }
            - { name: root, mountPath: /var/lib/umbra-measurer/cert, subPath: measurer/cert, readOnly: true }
            - { name: root, mountPath: /var/www/umbra/.well-known/umbra, subPath: www, readOnly: true }
            - { name: descriptors, mountPath: /etc/umbra-signer/descriptors, readOnly: true }
            {{- include "umbra.trustMount" . | nindent 12 }}
      volumes:
        {{- include "umbra.volumes" . | nindent 8 }}
        - name: descriptors
          configMap:
            name: {{ .Release.Name }}-descriptors
