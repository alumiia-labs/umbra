{{- /* Each relay of each server, on the node of that server, under the
       network of the host: it states the address of the node, and it sees
       the address of each client and each relay. */ -}}
{{- $entries := include "umbra.entries" . | fromJsonArray }}
{{- $signer := include "umbra.server" (list $ .Values.signer.server) | fromJson }}
{{- range $server := .Values.servers }}
{{- range $index, $relay := $server.relays }}
{{- if not (regexMatch "^[a-z0-9-]+$" $relay.name) }}
{{- fail (printf "relay %s: a name of a-z, 0-9 and -" $relay.name) }}
{{- end }}
{{- $exit := eq $relay.role "exit" }}
{{- $memory := ternary $.Values.memory.exit $.Values.memory.relay $exit }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay-{{ $relay.name }}
  labels:
    {{- include "umbra.labels" $ | nindent 4 }}
    app.kubernetes.io/component: relay
    umbra.app/relay: {{ $relay.name }}
spec:
  replicas: 1
  # One pod holds the port and the store of the relay.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      umbra.app/relay: {{ $relay.name }}
  template:
    metadata:
      labels:
        {{- include "umbra.labels" $ | nindent 8 }}
        app.kubernetes.io/component: relay
        umbra.app/relay: {{ $relay.name }}
      annotations:
        checksum/network: {{ $.Values.network.keyset | sha256sum }}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: {{ include "umbra.node" $server }}
      securityContext:
        supplementalGroups: [10000]
      initContainers:
        {{- include "umbra.init" $ | nindent 8 }}
      containers:
        - name: relay
          image: {{ include "umbra.serverImage" (list $ $server) }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          args: ["relay"]
          env:
            - { name: UMBRA_RELAY_NAME, value: {{ $relay.name | quote }} }
            - { name: UMBRA_RELAY_ROLE, value: {{ $relay.role | quote }} }
            - { name: UMBRA_RELAY_CLASS, value: {{ $relay.class | quote }} }
            - { name: UMBRA_PUBLIC_HOST, value: {{ printf "%s.%s" $server.name $.Values.domain | quote }} }
            - { name: UMBRA_PUBLIC_ADDRESS, value: {{ $server.address | quote }} }
            - { name: UMBRA_PUBLIC_PORT, value: {{ $relay.port | quote }} }
            - { name: UMBRA_OPERATOR, value: {{ $.Values.operator | quote }} }
            - { name: UMBRA_COUNTRY, value: {{ $server.country | default $.Values.country | quote }} }
            - { name: UMBRA_ASN, value: {{ $server.asn | default $.Values.asn | quote }} }
            - { name: UMBRA_FAMILY, value: {{ $.Values.family | quote }} }
            - { name: UMBRA_SIGNER, value: {{ printf "%s.%s,%s,443" $signer.name $.Values.domain $signer.address | quote }} }
            # The two relays of a server never start again together.
            - { name: UMBRA_RESTART_DELAY, value: {{ mul $index 120 | quote }} }
            {{- if $exit }}
            - { name: UMBRA_CHUNK_CAPACITY, value: {{ $.Values.chunkCapacity | int64 | quote }} }
            - { name: UMBRA_NDR_ROUTE, value: {{ printf "https://%s.%s/ohttp" (include "umbra.route" (list $ $.Values.ndr.server)) $.Values.domain | quote }} }
            - { name: UMBRA_NDR_KEY_CONFIG, value: {{ $.Values.network.ndrKeyConfig | quote }} }
            - { name: UMBRA_DIRECTORY_ROUTE, value: {{ printf "https://%s.%s/directory" (include "umbra.route" (list $ $.Values.directory.server)) $.Values.domain | quote }} }
            - { name: UMBRA_DIRECTORY_PINS, value: {{ $.Values.network.directoryPins | quote }} }
            {{- end }}
            {{- if eq $relay.role "entry" }}
            {{- if ne $server.name $.Values.ndr.server }}
            - { name: UMBRA_OHTTP_GATEWAY, value: {{ printf "https://%s.%s:%v/gateway" $.Values.ndr.server $.Values.domain $.Values.servicePort | quote }} }
            {{- end }}
            {{- if ne $server.name $.Values.directory.server }}
            - { name: UMBRA_DIRECTORY_GATEWAY, value: {{ printf "https://%s.%s:%v/gateway" $.Values.directory.server $.Values.domain $.Values.servicePort | quote }} }
            {{- end }}
            {{- end }}
            {{- include "umbra.trustEnv" $ | nindent 12 }}
          ports:
            - name: relay
              containerPort: {{ $relay.port }}
          readinessProbe:
            tcpSocket:
              port: {{ $relay.port }}
            periodSeconds: 10
          resources:
            requests:
              memory: {{ $memory.request }}
            limits:
              memory: {{ $memory.limit }}
          securityContext:
            {{- include "umbra.security" (dict "uid" 10001) | nindent 12 }}
          volumeMounts:
            {{- include "umbra.baseMounts" $ | nindent 12 }}
            - name: root
              mountPath: /var/lib/umbra
              subPath: relays/{{ $relay.name }}
            - name: root
              mountPath: /etc/umbra/tls
              subPath: tls
              readOnly: true
            {{- if $.Values.network.keyset }}
            - name: network
              mountPath: /etc/umbra/network
              readOnly: true
            {{- end }}
            {{- include "umbra.trustMount" $ | nindent 12 }}
      volumes:
        {{- include "umbra.volumes" $ | nindent 8 }}
        {{- if $.Values.network.keyset }}
        - name: network
          configMap:
            name: {{ $.Release.Name }}-network
        {{- end }}
{{- end }}
{{- end }}
