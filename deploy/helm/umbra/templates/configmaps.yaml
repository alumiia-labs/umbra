{{- /* The public values of the network: the key set that each relay pins,
       the descriptor of each relay for the signer, and the network file of
       the release app. None of them is a secret. */ -}}
{{- if .Values.network.keyset }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-network
  labels:
    {{- include "umbra.labels" . | nindent 4 }}
binaryData:
  keyset.bin: {{ .Values.network.keyset }}
---
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-descriptors
  labels:
    {{- include "umbra.labels" . | nindent 4 }}
binaryData:
  {{- range $name, $descriptor := .Values.network.descriptors }}
  {{ $name }}.desc: {{ $descriptor }}
  {{- end }}
---
{{- /* NTF-002: the app reaches each gateway through the OHTTP relay of an
       entry relay on another server. The carriers of the manifest are the
       servers of the entry relays and the signer (Part 3 §3.10). */ -}}
{{- $carriers := list }}
{{- range (include "umbra.entries" . | fromJsonArray) }}
{{- $carriers = append $carriers . }}
{{- end }}
{{- $carriers = append $carriers .Values.signer.server }}
{{- $lines := list }}
{{- range $carriers }}
{{- $server := include "umbra.server" (list $ .) | fromJson }}
{{- $lines = append $lines (printf "%s.%s,%s" .  $.Values.domain $server.address) }}
{{- end }}
{{- $ndrRoute := include "umbra.server" (list $ (include "umbra.route" (list $ .Values.ndr.server))) | fromJson }}
{{- $directoryRoute := include "umbra.server" (list $ (include "umbra.route" (list $ .Values.directory.server))) | fromJson }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-release-network
  labels:
    {{- include "umbra.labels" . | nindent 4 }}
data:
  network.properties: |
    carriers={{ join ";" $lines }}
    ndr_relay=https://{{ $ndrRoute.name }}.{{ .Values.domain }}/ohttp,{{ $ndrRoute.address }}
    directory_relay=https://{{ $directoryRoute.name }}.{{ .Values.domain }}/directory,{{ $directoryRoute.address }}
    invitation_host={{ .Values.invitationHost | default .Values.domain }}
{{- if .Values.trust }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-trust
  labels:
    {{- include "umbra.labels" . | nindent 4 }}
data:
  ca.pem: |
    {{- .Values.trust | nindent 4 }}
{{- end }}
