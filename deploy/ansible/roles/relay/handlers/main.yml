# The relays of this server restart one at a time. The run stops at a relay
# that does not stay up (umbra-restart), before it reaches the next server.
- name: Restart umbra-relay
  ansible.builtin.shell:
    cmd: |
      set -eu
      systemctl daemon-reload
      {% for relay in relays %}
      /usr/local/sbin/umbra-restart umbra-relay@{{ relay.name }}.service {{ relay.port }}
      {% endfor %}
  changed_when: true
