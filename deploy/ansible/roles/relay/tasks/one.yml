# Phase 2 of one relay, `relay` of the loop in main.yml.

# The relay walks the key chain of the signer itself (REL-200) and writes
# the newer set here. A run that reached the signer hands it the newest
# set; each run gives a relay with no set the one in build/.
- name: "The key set that {{ relay.name }} verifies each manifest under is there"
  ansible.builtin.copy:
    src: "{{ umbra_out }}/keyset.bin"
    dest: "/var/lib/umbra-relay/{{ relay.name }}/keyset.bin"
    owner: umbra-relay
    group: umbra-relay
    mode: "0644"
    force: "{{ hostvars[groups['signer'][0]].umbra_signed | default(false) }}"
  notify: Restart umbra-relay

# A root is valid for three hours, thus the relay takes the manifest that
# the signer made in this same run. A run that did not reach the signer,
# as one with --limit, leaves the manifest that the relay fetched itself.
- name: "The newest manifest of {{ relay.name }} is there"
  ansible.builtin.copy:
    src: "{{ umbra_out }}/manifest"
    dest: "/var/lib/umbra-relay/{{ relay.name }}/manifest.bin"
    owner: umbra-relay
    group: umbra-relay
    mode: "0644"
  when: hostvars[groups['signer'][0]].umbra_signed | default(false)

# The memory limit of an exit relay, and the files of the other relays of
# this server, which this relay does not see.
- name: "The directory of the unit settings of {{ relay.name }} is there"
  ansible.builtin.file:
    path: "/etc/systemd/system/umbra-relay@{{ relay.name }}.service.d"
    state: directory
    mode: "0755"

- name: "The unit settings of {{ relay.name }} are there"
  ansible.builtin.template:
    src: relay-dropin.conf.j2
    dest: "/etc/systemd/system/umbra-relay@{{ relay.name }}.service.d/10-umbra.conf"
    mode: "0644"
  notify: Restart umbra-relay

- name: "The relay {{ relay.name }} runs"
  ansible.builtin.systemd:
    name: "umbra-relay@{{ relay.name }}"
    enabled: true
    state: started
    daemon_reload: true

# A relay reads its next layer and its replicas at its start, thus a relay
# set with a relay more or less takes a restart of each relay; the play
# goes one server at a time.
- name: "The relay {{ relay.name }} takes a changed relay set"
  ansible.builtin.systemd:
    name: "umbra-relay@{{ relay.name }}"
    state: restarted
  when: hostvars[groups['signer'][0]].umbra_relay_set.changed | default(false)

- name: "The relay {{ relay.name }} answers on its port"
  ansible.builtin.wait_for:
    port: "{{ relay.port }}"
    timeout: 30
