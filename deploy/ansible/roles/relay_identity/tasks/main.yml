# Phase 1 of each relay of this server: its identity, made here one time,
# and its signed descriptor, which goes to the signer (Part 10 REL-047,
# REL-048). One server can run several relays; `relays` in the inventory
# names them.
- name: The user and the directories of the relays are there
  ansible.builtin.include_role:
    name: common
    tasks_from: service_user
  vars:
    umbra_service: umbra-relay
    umbra_fragments: relays

- name: The binary of the relay that runs now stays as umbra-relay.prev
  ansible.builtin.include_role:
    name: common
    tasks_from: binary
  vars:
    umbra_binary: umbra-relay

- name: The binary of the relay is there
  ansible.builtin.copy:
    src: "{{ umbra_bin_dir }}/umbra-relay"
    dest: /usr/local/bin/umbra-relay
    mode: "0755"
  notify: Restart umbra-relay

- name: The relays of this server are stated
  ansible.builtin.assert:
    that:
      - relays is defined
      - relays | length > 0
      - relays | map(attribute='port') | unique | length == relays | length
    fail_msg: Give each relay server a list `relays`, each relay on a port of its own.

- name: Each relay of this server
  ansible.builtin.include_tasks: one.yml
  loop: "{{ relays }}"
  loop_control:
    loop_var: relay
    label: "{{ relay.name }}"
