# The signer of the directory: the seven authority keys of a network of
# one operator, a manifest each hour, and nginx that serves it at
# /.well-known/umbra/manifest to the relays and to the app (Part 3 NET-316).

- name: The packages of the signer are there
  ansible.builtin.apt:
    name: nginx
    state: present
    lock_timeout: "{{ umbra_apt_lock_timeout }}"

- name: The user of the signer is there
  ansible.builtin.user:
    name: umbra-signer
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/umbra-signer
    create_home: true

- name: The directories of the signer are there
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: /etc/umbra-signer, owner: root, mode: "0755" }
    - { path: /etc/umbra-signer/descriptors, owner: root, mode: "0755" }
    - { path: /var/www/umbra/.well-known/umbra, owner: umbra-signer, mode: "0755" }
    # The listed class of each relay, which the signer writes (REL-001).
    - { path: /var/lib/umbra-signer/state, owner: umbra-signer, mode: "0755" }

- name: The binary of the signer that runs now stays as umbra-signer.prev
  ansible.builtin.include_role:
    name: common
    tasks_from: binary
  vars:
    umbra_binary: umbra-signer

- name: The binary of the signer is there
  ansible.builtin.copy:
    src: "{{ umbra_bin_dir }}/umbra-signer"
    dest: /usr/local/bin/umbra-signer
    mode: "0755"

# The seven seeds are made here one time and never leave this server. Keep
# a copy of /var/lib/umbra-signer/keys offline: without it no new manifest
# verifies under the key set that the app ships.
# The first key set alone; a later one comes from `rotate` (README), and
# the signer refuses keys that the key chain does not reach. A signer that
# holds a key chain, a key set in any directory, or a published key set is
# past its first run. This task then makes no key. Thus a mistyped
# umbra_signer_keys, or an old key directory that moved offline, never
# gives the network a second, unrelated key set.
- name: The signs of an earlier run of the signer
  ansible.builtin.shell:
    cmd: |
      set -eu
      if [ -e /var/lib/umbra-signer/keychain ] \
          || [ -e /var/www/umbra/.well-known/umbra/keyset.bin ] \
          || [ -n "$(find /var/lib/umbra-signer -maxdepth 2 -name keyset.bin -print -quit)" ]; then
          echo earlier
      fi
  register: umbra_signer_state
  changed_when: false

- name: The authority keys are made one time
  become: true
  become_user: umbra-signer
  ansible.builtin.command:
    cmd: "/usr/local/bin/umbra-signer keygen {{ umbra_signer_keys }}"
    creates: "{{ umbra_signer_keys }}/keyset.bin"
  when: "'earlier' not in umbra_signer_state.stdout"

- name: The key directory of umbra_signer_keys
  ansible.builtin.stat:
    path: "{{ umbra_signer_keys }}/keyset.bin"
  register: umbra_signer_keyset

- name: The signer holds the key set that umbra_signer_keys names
  ansible.builtin.assert:
    that: umbra_signer_keyset.stat.exists
    fail_msg: >-
      {{ umbra_signer_keys }} holds no key set, and this signer made its keys
      in an earlier run. Check umbra_signer_keys in group_vars/all.yml, or
      bring the key directory back from the backup. The run makes no new keys.

- name: The descriptor of each relay is there
  ansible.builtin.copy:
    src: "{{ umbra_out }}/descriptors/{{ item }}.desc"
    dest: "/etc/umbra-signer/descriptors/{{ item }}.desc"
    mode: "0644"
  loop: "{{ groups['relays'] | map('extract', hostvars, 'relays') | flatten | map(attribute='name') | list }}"

# The relay lines change when a relay comes or goes, or a class changes;
# phase 2 restarts each relay then (roles/relay).
- name: The settings of the signer are there
  ansible.builtin.template:
    src: sign.conf.j2
    dest: /etc/umbra-signer/sign.conf
    mode: "0644"
  register: umbra_relay_set

- name: The service and the timer of the signer are there
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - umbra-signer.service
    - umbra-signer.timer

- name: The timer signs each hour
  ansible.builtin.systemd:
    name: umbra-signer.timer
    enabled: true
    state: started
    daemon_reload: true

# An hour takes one manifest (Part 10 `REL-160`). The signer leaves the
# manifest of this hour in its place. It prints `kept=same` when that one
# holds the relays of this run already, and `kept=other` when it does not.
- name: The signer signs a manifest now, unless this hour has one
  become: true
  become_user: umbra-signer
  ansible.builtin.shell:
    # nginx reads the files that this run writes, thus the mask.
    cmd: |
      set -eu
      umask 022
      /usr/local/bin/umbra-signer sign {{ '--force' if umbra_sign_force | bool else '' }} /etc/umbra-signer/sign.conf
  register: umbra_sign
  changed_when: "'kept=' not in umbra_sign.stdout"

# The relays of phase 2 need a manifest that lists each relay of this run.
# Thus the run waits here for the next hour, 60 minutes at most, and signs
# then. The timer of the signer does the same two minutes later.
- name: Changed settings wait for the next hour, which has no manifest yet
  ansible.builtin.shell:
    cmd: |
      set -eu
      umask 022
      sleep $(( 3600 - $(date +%s) % 3600 + 5 ))
      /usr/sbin/runuser -u umbra-signer -- /usr/local/bin/umbra-signer sign /etc/umbra-signer/sign.conf
  when: "'kept=other' in umbra_sign.stdout"
  async: 3900
  poll: 15
  register: umbra_sign_late
  failed_when: umbra_sign_late.rc != 0 or 'kept=other' in umbra_sign_late.stdout

- name: This run holds a fresh manifest for the relays
  ansible.builtin.set_fact:
    umbra_signed: true

- name: nginx serves the manifest
  ansible.builtin.template:
    src: nginx-umbra.conf.j2
    dest: /etc/nginx/sites-available/umbra
    mode: "0644"
  notify: Reload nginx

- name: The site of the manifest is on, and the default site is off
  ansible.builtin.file:
    src: "{{ item.src | default(omit) }}"
    path: "{{ item.path }}"
    state: "{{ item.state }}"
  loop:
    - { src: /etc/nginx/sites-available/umbra, path: /etc/nginx/sites-enabled/umbra, state: link }
    - { path: /etc/nginx/sites-enabled/default, state: absent }
  notify: Reload nginx

- name: nginx runs
  ansible.builtin.service:
    name: nginx
    enabled: true
    state: started

- name: The key set and the manifest go to this machine
  ansible.builtin.fetch:
    src: "/var/www/umbra/.well-known/umbra/{{ item }}"
    dest: "{{ umbra_out }}/{{ item }}"
    flat: true
  loop:
    - keyset.bin
    - manifest
