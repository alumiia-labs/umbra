# The directory of Part 9 and the issuer of Part 13 §13.9, on port
# umbra_service_port.

- name: The user and the directories of the directory are there
  ansible.builtin.include_role:
    name: common
    tasks_from: service_user
  vars:
    umbra_service: umbra-directory
    umbra_fragments: directory.d

- name: The binary of the directory that runs now stays as umbra-directory.prev
  ansible.builtin.include_role:
    name: common
    tasks_from: binary
  vars:
    umbra_binary: umbra-directory

- name: The binary of the directory is there
  ansible.builtin.copy:
    src: "{{ umbra_bin_dir }}/umbra-directory"
    dest: /usr/local/bin/umbra-directory
    mode: "0755"
  notify: Restart umbra-directory

# Each seed is made here one time and never leaves this server. The three
# log signers sit on one server while one operator runs the network; later
# the second and the third are the two auditors of Part 9 §9.5.2. The file
# takes its name only once each line checks.
- name: The seeds of the directory are made one time
  ansible.builtin.shell:
    cmd: |
      set -eu
      umask 077
      tmp=$(mktemp /etc/umbra/directory.d/.secret.XXXXXX)
      seed() { openssl rand -hex 32; }
      {
        echo "kem_seed=$(seed)"
        echo "voprf_seed=$(seed)"
        echo "vrf_seed=$(seed)"
        echo "issuer_seed=$(seed)"
        echo "cross_relay_seed=$(seed)"
        echo "signer_seeds=$(seed),$(seed),$(seed)"
      } > "$tmp"
      for name in kem_seed voprf_seed vrf_seed issuer_seed cross_relay_seed; do
        grep -Eq "^$name=[0-9a-f]{64}\$" "$tmp"
      done
      grep -Eq '^signer_seeds=[0-9a-f]{64},[0-9a-f]{64},[0-9a-f]{64}$' "$tmp"
      mv "$tmp" /etc/umbra/directory.d/20-secret.conf
    creates: /etc/umbra/directory.d/20-secret.conf

- name: The public settings of the directory are there
  ansible.builtin.copy:
    dest: /etc/umbra/directory.d/10-public.conf
    mode: "0644"
    content: |
      listen=0.0.0.0:{{ umbra_service_port }}
      cert=/etc/umbra/tls/cert.pem
      key=/etc/umbra/tls/key.pem
      key_id=1
      store=/var/lib/umbra-directory/directory.db
      keyset_epoch=1

- name: The settings file joins the two fragments
  ansible.builtin.assemble:
    src: /etc/umbra/directory.d
    dest: /etc/umbra/directory.conf
    regexp: '^[0-9]+-.*\.conf$'
    owner: root
    group: umbra-directory
    mode: "0640"
  notify: Restart umbra-directory

- name: The service of the directory is there
  ansible.builtin.template:
    src: umbra-directory.service.j2
    dest: /etc/systemd/system/umbra-directory.service
    mode: "0644"
  notify: Restart umbra-directory

- name: The directory runs
  ansible.builtin.systemd:
    name: umbra-directory
    enabled: true
    state: started
    daemon_reload: true

- name: The pins that the relays and the app hold
  ansible.builtin.command:
    cmd: /usr/local/bin/umbra-directory pins /etc/umbra/directory.conf
  register: directory_pins
  changed_when: false

- name: The pins go to this machine
  ansible.builtin.copy:
    content: "{{ directory_pins.stdout | trim }}\n"
    dest: "{{ umbra_out }}/directory-pins.hex"
    mode: "0644"
  delegate_to: localhost
  become: false
