# One binary of /usr/local/bin, `umbra_binary` names it. Before a new
# binary replaces it, the one that runs now stays as <name>.prev, thus an
# operator can go back to it (README, "Going back to the binary before").
# The role then copies the new binary itself and notifies its own handler.

- name: "The new binary of {{ umbra_binary }} on this machine"
  ansible.builtin.stat:
    path: "{{ umbra_bin_dir }}/{{ umbra_binary }}"
    checksum_algorithm: sha256
  register: umbra_binary_new
  delegate_to: localhost
  become: false

- name: "The binary of {{ umbra_binary }} on this server"
  ansible.builtin.stat:
    path: "/usr/local/bin/{{ umbra_binary }}"
    checksum_algorithm: sha256
  register: umbra_binary_old

- name: "The binary of {{ umbra_binary }} that runs now stays as {{ umbra_binary }}.prev"
  ansible.builtin.copy:
    src: "/usr/local/bin/{{ umbra_binary }}"
    dest: "/usr/local/bin/{{ umbra_binary }}.prev"
    remote_src: true
    mode: "0755"
  when:
    - umbra_binary_old.stat.exists
    - umbra_binary_new.stat.exists
    - umbra_binary_new.stat.checksum != umbra_binary_old.stat.checksum
