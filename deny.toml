# Dependency policy of Part 15 §15.2.7.
# Each allow entry names its register. A transitive crate that is not on the
# list fails the build. A skip entry carries a date and a cause, and CI fails
# on one older than 90 days.

[graph]
all-features = false
targets = [
  { triple = "aarch64-linux-android" },
  { triple = "x86_64-unknown-linux-gnu" },
  { triple = "wasm32-unknown-unknown" },
]

[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "BSD-3-Clause", "Unicode-3.0", "AGPL-3.0-only"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = false
skip = []
# The allow list closes the graph. Register R1 is the message core of Part 5
# §5.1. An entry marked `build` is a proc-macro, a build script, or a crate
# that only those reach; no binary links it, thus it charges no register cap
# (Part 15 §15.2.3), and DEPENDENCIES.md lists it apart.
allow = [
  { crate = "aead" },                    # R1
  { crate = "argon2" },                  # R2, AUX-4
  { crate = "base64ct" },                # R2, under argon2
  { crate = "blake2" },                  # R2, under argon2
  { crate = "password-hash" },           # R2, under argon2
  { crate = "aes" },                     # R1, the onion layer only
  { crate = "block-buffer" },            # R1
  { crate = "cfg-if" },                  # R1
  { crate = "chacha20" },                # R1
  { crate = "chacha20poly1305" },        # R1
  { crate = "cipher" },                  # R1
  { crate = "cmov" },                    # R1
  { crate = "cpubits" },                 # R1, under polyval
  { crate = "cpufeatures" },             # R1
  { crate = "crypto-common" },           # R1
  { crate = "ctr" },                     # R1, the onion layer only
  { crate = "ctutils" },                 # R1
  { crate = "curve25519-dalek" },        # R1
  { crate = "curve25519-dalek-derive" }, # build
  { crate = "digest" },                  # R1
  { crate = "hkdf" },                    # R1
  { crate = "hmac" },                    # R1
  { crate = "hybrid-array" },            # R1
  { crate = "inout" },                   # R1
  { crate = "keccak" },                  # R1
  { crate = "kem" },                     # R1
  { crate = "libc" },                    # R1, aarch64-linux-android only, under cpufeatures
  { crate = "ml-dsa" },                  # R1
  { crate = "ml-kem" },                  # R1
  { crate = "module-lattice" },          # R1
  { crate = "num-traits" },              # R1
  { crate = "poly1305" },                # R1
  { crate = "polyval" },                 # R1, the onion layer only
  { crate = "proc-macro2" },             # build
  { crate = "quote" },                   # build
  { crate = "rand_core" },               # R1
  { crate = "sha3" },                    # R1
  { crate = "shake" },                   # R1
  { crate = "signature" },               # R1
  { crate = "sponge-cursor" },           # R1
  { crate = "subtle" },                  # R1
  { crate = "syn" },                     # build
  { crate = "typenum" },                 # R1
  { crate = "unicode-ident" },           # build
  { crate = "universal-hash" },          # R1
  { crate = "x25519-dalek" },            # R1
  { crate = "zeroize" },                 # R1
  { crate = "zeroize_derive" },          # build
  { crate = "autocfg" },                 # build
  { crate = "rustc_version" },           # build
  { crate = "semver" },                  # build
  # dev-dependencies of the known-answer harness; no shipped binary links them
  { crate = "itoa" },                    # dev
  { crate = "memchr" },                  # dev
  { crate = "serde_core" },              # dev
  { crate = "serde_json" },              # dev
  { crate = "zmij" },                    # dev
  { crate = "umbra-crypto" },            # workspace
  { crate = "umbra-wire" },              # workspace
  { crate = "umbra-onion" },             # workspace
  { crate = "umbra-queue" },             # workspace
  { crate = "umbra-transport" },         # workspace
  { crate = "umbra-core" },              # workspace
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
