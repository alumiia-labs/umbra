[workspace]
resolver = "2"
members = ["crates/umbra-crypto", "crates/umbra-wire", "crates/umbra-onion", "crates/umbra-queue", "crates/umbra-transport", "crates/umbra-core", "crates/umbra-relay", "crates/umbra-ffi"]

[workspace.package]
version = "0.13.0"
edition = "2021"
rust-version = "1.98"
license = "AGPL-3.0-only"
repository = "https://github.com/Tomgie/umbra"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"

# A proof of work of Part 13 takes seconds in a build with no optimization,
# thus a debug build and each test optimize the two crates of Equi-X.
[profile.dev.package.equix]
opt-level = 3

[profile.dev.package.hashx]
opt-level = 3

# The RSA key of an issuer takes two 1 024-bit primes, which a build with no
# optimization finds in minutes.
[profile.dev.package.crypto-primes]
opt-level = 3

[profile.dev.package.crypto-bigint]
opt-level = 3

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
panic = "abort"
debug = false
