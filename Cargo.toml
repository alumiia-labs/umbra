[workspace]
resolver = "2"
members = ["crates/umbra-crypto", "crates/umbra-wire", "crates/umbra-onion", "crates/umbra-queue"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "AGPL-3.0-only"
repository = "https://github.com/Tomgie/umbra"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
panic = "abort"
debug = false
