[workspace]
resolver = "2"
members = ["crates/umbra-crypto", "crates/umbra-wire", "crates/umbra-onion", "crates/umbra-queue", "crates/umbra-transport", "crates/umbra-core", "crates/umbra-relay", "crates/umbra-ffi", "crates/umbra-simd"]

[workspace.package]
version = "0.46.1"
edition = "2021"
rust-version = "1.99"
license = "AGPL-3.0-only"
repository = "https://github.com/alumiia-labs/umbra"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"

# The tests run real key exchanges, Argon2, and TLS. With no optimization of
# the dependencies, the socket tests of the client take about 20 minutes, and
# their time bounds fail on a loaded machine. The crates of this workspace
# keep no optimization, thus a change to them builds fast.
[profile.dev.package."*"]
opt-level = 2

# The allocator of umbra-simd wipes each block at its free, and each test of
# the client surface runs on it. Its wipe has no optimization otherwise.
[profile.dev.package.umbra-simd]
opt-level = 3

# A proof of work of Part 13 takes seconds in a build with no optimization.
# Thus a debug build and each test optimize the two crates of Equi-X.
[profile.dev.package.equix]
opt-level = 3

[profile.dev.package.hashx]
opt-level = 3

# The RSA key of an issuer takes two 1 024-bit primes, which a build with no
# optimization finds in minutes.
[profile.dev.package.crypto-primes]
opt-level = 3

[profile.dev.package.crypto-bigint]
opt-level = 3

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
panic = "abort"
debug = false
